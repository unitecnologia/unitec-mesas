name: unitec_mesas
description: Unitec Mesas - app do garçom integrado às mesas do PDV do Unitec ERP (offline-first).
publish_to: "none"
version: 1.0.3+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  sqflite: ^2.4.1
  path: ^1.9.0
  uuid: ^4.5.1
  device_info_plus: ^10.1.0
  connectivity_plus: ^6.1.0
  crypto: ^3.0.7
  path_provider: ^2.1.6

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: assets/icon/app_icon.png
  adaptive_icon_foreground_inset: 16
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
